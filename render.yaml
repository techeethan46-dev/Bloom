services:
  - type: web
    name: bloom-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    # Render checks this page, and UptimeRobot pings it so the free service doesn't fall asleep.
    healthCheckPath: /health
    # Only secrets live here. Channels and roles are set in Discord with /setup.
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: bloom_bot
      # Optional: a server ID, so commands show up instantly in that one server while testing.
      - key: GUILD_ID
        sync: false
